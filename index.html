<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPT4 2026 进度追踪器 (本地版 - 20/10/2026 重排版)</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel CDN (For JSX compilation in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons CDN (Vanilla JS version) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        #root { min-height: 100vh; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass-header { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
        }
        
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(90deg, #1e3a8a, #4f46e5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;

        // 更新至 2026年10月20日 重新排期版本
        const scheduleData = [
            { id: 1, title: "Penyelenggaraan sistem oleh JPN", start: '2026-07-24', end: '2026-07-24', category: "Sistem", action: "JPN" },
            { id: 2, title: "Pendaftaran murid secara dalam talian (Sekolah KPM)", start: '2026-07-27', end: '2026-08-07', category: "Pendaftaran", action: "SuP / GB" },
            { id: 3, title: "Pendaftaran murid (Sekolah Bawah Agensi Kerajaan dan Swasta)", start: '2026-08-09', end: '2026-08-12', category: "Pendaftaran", action: "SuP / GB" },
            { id: 4, title: "Tindakan khas (Braille dan Cetakan Besar)", start: '2026-07-27', end: '2026-08-12', category: "Pendaftaran", action: "SuP / GB" },
            { id: 5, title: "Pembetulan maklumat murid", start: '2026-08-13', end: '2026-11-20', category: "Pembetulan", action: "SuP" },
            { id: 6, title: "Pembetulan mata pelajaran", start: '2026-08-13', end: '2026-10-05', category: "Pembetulan", action: "SuP" },
            { id: 7, title: "Pembatalan pendaftaran", start: '2026-08-13', end: '2026-10-05', category: "Pembetulan", action: "SuP / GB" },
            { id: 8, title: "Perpindahan murid", start: '2026-08-13', end: '2026-11-20', category: "Pendaftaran", action: "SuP / GB" },
            { id: 9, title: "Taklimat Profesionalisme KPK dan KPN", start: '2026-09-14', end: '2026-09-14', category: "Taklimat", action: "KPK / KPN" },
            { id: 10, title: "Taklimat keselamatan dan pengurusan oleh Ketua Pengawas kepada Pengawas Pentaksiran", start: '2026-10-05', end: '2026-10-05', category: "Taklimat", action: "Ketua Pengawas / Pengawas Pentaksiran" },
            { id: 11, title: "Penyerahan dan pengambilan Instrumen Matriks Pembelajaran di bilik kebal", start: '2026-10-05', end: '2026-10-08', category: "Instrumen", action: "JPN / PPD / Penyelia Kawasan / Ketua Pengawas" },
            { id: 12, title: "Pentadbiran MPT4 (Kebangsaan)", start: '2026-10-06', end: '2026-10-08', category: "Peperiksaan", action: "SuP / Ketua Pengawas / Pengawas Pentaksiran" },
            { id: 13, title: "Pentadbiran MPT4 (Negeri terjejas jerebu - Batu Pahat & Johor)", start: '2026-10-19', end: '2026-10-20', category: "Peperiksaan", action: "Pengawas Pentaksiran" },
            { id: 14, title: "Mesyuarat Penyelarasan Penskoran (BM, BI)", start: '2026-10-07', end: '2026-10-07', category: "Penskoran", action: "KPK / KPN / KPKw / KPMP" },
            { id: 15, title: "Mesyuarat Penyelarasan Penskoran (Matematik SK, SJKC, SJKT, DLP)", start: '2026-10-21', end: '2026-10-21', category: "Penskoran", action: "KPK / KPN / KPKw / KPMP" },
            { id: 16, title: "Mesyuarat Penyelarasan Penskoran (Sains SK, SJKC, SJKT, DLP)", start: '2026-10-21', end: '2026-10-21', category: "Penskoran", action: "KPK / KPN / KPKw / KPMP" },
            { id: 17, title: "Mesyuarat Penyelarasan Penskoran (BC, BT)", start: '2026-10-22', end: '2026-10-22', category: "Penskoran", action: "KPK / KPN / KPKw / KPMP" },
            { id: 18, title: "Mesyuarat Penyelarasan Penskoran Peringkat Sekolah", start: '2026-10-08', end: '2026-10-22', category: "Penskoran", action: "KPMP / PMP" },
            { id: 19, title: "Penskoran SJM, Moderasi, dan Perekodan Skor melalui SBPPA", start: '2026-10-08', end: '2026-11-28', category: "Penskoran / Sistem", action: "SPP PPD / KPMP / KPKw / SuP / Pemeriksa" },
            { id: 20, title: "Pengesahan Skor oleh GB melalui SBPPA", start: '2026-10-08', end: '2026-11-28', category: "Sistem", action: "GB" },
            { id: 21, title: "Memuat turun, Mencetak dan Penyerahan Pelaporan MPT4", start: '2026-11-29', end: '2026-12-04', category: "Pelaporan", action: "SuP / GB" }
        ];

        const parseDate = (dateString) => new Date(`${dateString}T00:00:00`).getTime();
        
        const getTodayString = () => {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        const Icon = ({ name, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    if(className) i.className = className;
                    iconRef.current.appendChild(i);
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        function App() {
            const todayStr = getTodayString();
            const [currentDateStr, setCurrentDateStr] = useState(todayStr);
            const [currentTime, setCurrentTime] = useState(parseDate(todayStr));
            const [showHidden, setShowHidden] = useState(false);
            
            const [hiddenIds, setHiddenIds] = useState(() => {
                const saved = localStorage.getItem('mpt4_hidden_local');
                return saved ? JSON.parse(saved) : [];
            });
            const [manualCompletedIds, setManualCompletedIds] = useState(() => {
                const saved = localStorage.getItem('mpt4_completed_local');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => {
                localStorage.setItem('mpt4_hidden_local', JSON.stringify(hiddenIds));
            }, [hiddenIds]);

            useEffect(() => {
                localStorage.setItem('mpt4_completed_local', JSON.stringify(manualCompletedIds));
            }, [manualCompletedIds]);

            const handleHide = (id) => setHiddenIds(prev => [...new Set([...prev, id])]);
            const handleRestore = (id) => setHiddenIds(prev => prev.filter(taskId => taskId !== id));
            const handleComplete = (id) => setManualCompletedIds(prev => [...new Set([...prev, id])]);
            const handleUncomplete = (id) => setManualCompletedIds(prev => prev.filter(taskId => taskId !== id));

            const handleDateChange = (e) => {
                const newDate = e.target.value;
                if (newDate) {
                    setCurrentDateStr(newDate);
                    setCurrentTime(parseDate(newDate));
                }
            };

            const tasksCategorized = useMemo(() => {
                const active = [];
                const upcoming = [];
                const completed = [];
                const hidden = [];

                scheduleData.forEach(task => {
                    if (hiddenIds.includes(task.id)) {
                        hidden.push(task);
                        return;
                    }

                    const startT = parseDate(task.start);
                    const endT = parseDate(task.end) + (24 * 60 * 60 * 1000) - 1; 
                    const totalDays = Math.ceil((endT - startT) / (1000 * 60 * 60 * 24));

                    if (manualCompletedIds.includes(task.id)) {
                        completed.push({ ...task, totalDays, isManual: true });
                    } 
                    else if (currentTime > endT) {
                        completed.push({ ...task, totalDays, isManual: false });
                    } else if (currentTime < startT) {
                        const daysUntilStart = Math.ceil((startT - currentTime) / (1000 * 60 * 60 * 24));
                        upcoming.push({ ...task, totalDays, daysUntilStart });
                    } else {
                        const daysRemaining = Math.ceil((endT - currentTime) / (1000 * 60 * 60 * 24));
                        const daysPassed = totalDays - daysRemaining;
                        const progressPercent = totalDays === 1 ? 50 : Math.min(100, Math.max(0, (daysPassed / totalDays) * 100));
                        active.push({ ...task, totalDays, daysRemaining, progressPercent });
                    }
                });

                upcoming.sort((a, b) => parseDate(a.start) - parseDate(b.start));
                completed.sort((a, b) => parseDate(b.end) - parseDate(a.end));

                return { active, upcoming, completed, hidden };
            }, [currentTime, hiddenIds, manualCompletedIds]);

            const { active, upcoming, completed, hidden } = tasksCategorized;

            return (
                <div className="min-h-screen text-slate-800 font-sans pb-12 selection:bg-blue-100 selection:text-blue-900">
                    <header className="glass-header sticky top-0 z-50 px-4 sm:px-6 lg:px-8 py-4 sm:py-5 shadow-sm transition-all duration-300">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="w-full md:w-auto">
                                <h1 className="text-xl sm:text-2xl md:text-3xl font-extrabold flex items-center gap-2 sm:gap-3 tracking-tight">
                                    <div className="p-1.5 sm:p-2 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg sm:rounded-xl shadow-lg shadow-blue-500/30 shrink-0">
                                        <Icon name="activity" className="w-5 h-5 sm:w-6 sm:h-6 text-white" />
                                    </div>
                                    <span className="leading-tight text-gradient">MPT4 2026 进度追踪</span>
                                </h1>
                                <p className="text-[11px] sm:text-sm text-slate-500 mt-2 flex items-center gap-1.5 font-medium">
                                    <Icon name="file-text" className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-blue-500 shrink-0" />
                                    已更新至最新通告（20/10/2026 烟霾重排版）
                                </p>
                            </div>
                            
                            <div className="flex items-center gap-2.5 sm:gap-3 bg-white/50 hover:bg-white/80 transition-colors px-3 sm:px-4 py-2.5 rounded-xl border border-slate-200/60 w-full md:w-auto shadow-sm group cursor-pointer focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-400">
                                <div className="p-1.5 bg-slate-100 rounded-md group-hover:bg-blue-50 group-hover:text-blue-600 transition-colors">
                                    <Icon name="calendar-days" className="text-slate-500 group-hover:text-blue-600 w-4 h-4 sm:w-4 sm:h-4 shrink-0 transition-colors" />
                                </div>
                                <div className="flex flex-col flex-1">
                                    <label htmlFor="currentDateInput" className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-0.5 cursor-pointer">
                                        当前日期
                                    </label>
                                    <input
                                        type="date"
                                        id="currentDateInput"
                                        value={currentDateStr}
                                        onChange={handleDateChange}
                                        className="bg-transparent text-xs sm:text-sm font-semibold text-slate-900 outline-none cursor-pointer w-full"
                                    />
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 sm:mt-8 space-y-8 sm:space-y-10">
                        <main className="space-y-8 sm:space-y-10">
                            {/* 当前进行中 */}
                            <section>
                                <div className="flex items-center justify-between mb-4 sm:mb-5">
                                    <h2 className="text-lg sm:text-xl font-bold flex items-center gap-2.5 text-slate-800 tracking-tight">
                                        <span className="relative flex h-3 w-3">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-500 opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-3 w-3 bg-blue-600"></span>
                                        </span>
                                        当前进行中的阶段
                                        <span className="bg-slate-200 text-slate-600 text-xs px-2 py-0.5 rounded-full ml-1">{active.length}</span>
                                    </h2>
                                </div>
                                
                                {active.length === 0 ? (
                                    <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-8 sm:p-12 flex flex-col items-center justify-center text-center gap-3 shadow-sm">
                                        <div className="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center mb-1">
                                            <Icon name="coffee" className="w-6 h-6 text-slate-400" />
                                        </div>
                                        <p className="text-sm sm:text-base text-slate-600 font-medium">目前没有正在进行的活动阶段</p>
                                        <p className="text-xs text-slate-400">您可以去喝杯咖啡放松一下，或者查看即将到来的任务。</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
                                        {active.map((task, index) => (
                                            <div key={task.id} 
                                                className="animate-fade-in-up bg-white rounded-2xl ring-1 ring-slate-200/60 shadow-sm hover:shadow-xl hover:shadow-blue-900/5 hover:-translate-y-1 hover:ring-blue-300 transition-all duration-300 p-5 sm:p-6 flex flex-col justify-between group relative overflow-hidden"
                                                style={{ animationDelay: `${index * 100}ms` }}
                                            >
                                                <div className="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-blue-400 to-indigo-500"></div>
                                                
                                                <div>
                                                    <div className="flex justify-between items-start gap-3 mb-4">
                                                        <h3 className="font-bold text-base sm:text-lg leading-snug text-slate-900 flex-1">{task.title}</h3>
                                                        <div className="flex items-center gap-1 sm:opacity-0 group-hover:opacity-100 transition-all duration-300 shrink-0 bg-slate-50/80 p-1 rounded-full backdrop-blur-sm -mt-1 -mr-1 sm:mt-0 sm:mr-0 border border-slate-100 sm:border-none">
                                                            <button onClick={() => handleComplete(task.id)} title="标记为完成" className="p-1.5 sm:p-2 text-emerald-600 hover:bg-emerald-100 hover:shadow-sm active:scale-90 rounded-full transition-all">
                                                                <Icon name="check" className="w-4 h-4 sm:w-5 sm:h-5" />
                                                            </button>
                                                            <button onClick={() => handleHide(task.id)} title="标记为无关 / 隐藏" className="p-1.5 sm:p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-100 hover:shadow-sm active:scale-90 rounded-full transition-all">
                                                                <Icon name="eye-off" className="w-4 h-4 sm:w-5 sm:h-5" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="flex flex-wrap items-center gap-2 mb-5">
                                                        <span className="px-3 py-1 bg-blue-50 text-blue-700 ring-1 ring-inset ring-blue-700/10 text-[10px] sm:text-xs font-bold rounded-full shadow-sm">
                                                            {task.category}
                                                        </span>
                                                        <span className="px-3 py-1 bg-slate-50 text-slate-700 ring-1 ring-inset ring-slate-500/10 text-[10px] sm:text-xs font-semibold rounded-full flex items-center gap-1 shadow-sm">
                                                            <Icon name="user" className="w-3 h-3 text-slate-400" />
                                                            {task.action}
                                                        </span>
                                                        <div className="flex items-center text-xs sm:text-sm text-slate-600 font-medium w-full mt-2 lg:mt-0 lg:w-auto bg-slate-50 px-3 py-1 rounded-full ring-1 ring-inset ring-slate-500/5">
                                                            <Icon name="calendar" className="w-3.5 h-3.5 mr-1.5 text-blue-500" />
                                                            {task.start} <span className="text-slate-400 mx-1">至</span> {task.end}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="space-y-2.5 mt-2 bg-gradient-to-r from-slate-50 to-white p-4 rounded-xl border border-slate-100 shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)]">
                                                    <div className="flex justify-between text-xs sm:text-sm items-end">
                                                        <span className="text-slate-500 font-semibold tracking-wide text-[11px] uppercase">进度状况</span>
                                                        <span className="font-extrabold text-blue-600 text-sm sm:text-base flex items-center gap-1.5">
                                                            <Icon name="clock" className="w-4 h-4 text-blue-500" /> 剩余 {task.daysRemaining} 天
                                                        </span>
                                                    </div>
                                                    <div className="w-full bg-slate-200/70 rounded-full h-3 overflow-hidden shadow-inner flex">
                                                        <div className="bg-gradient-to-r from-blue-400 to-indigo-600 h-full rounded-full transition-all duration-1000 ease-out relative" style={{ width: `${task.progressPercent}%` }}>
                                                            <div className="absolute top-0 left-0 w-full h-full bg-white/20"></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </section>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
                                {/* 即将到来 */}
                                <section>
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-base sm:text-lg font-bold flex items-center gap-2 text-slate-800 tracking-tight">
                                            <Icon name="alert-circle" className="w-4 h-4 sm:w-5 sm:h-5 text-amber-500" />
                                            即将到来的阶段
                                            <span className="bg-amber-100 text-amber-700 text-[10px] sm:text-xs px-2 py-0.5 rounded-full ml-1 font-bold">{upcoming.length}</span>
                                        </h2>
                                    </div>
                                    <div className="bg-white rounded-2xl ring-1 ring-slate-200/60 shadow-sm overflow-hidden">
                                        <div className="divide-y divide-slate-100 max-h-[350px] sm:max-h-[400px] overflow-y-auto">
                                            {upcoming.length === 0 ? (
                                                <div className="p-8 flex flex-col items-center justify-center text-center gap-2 animate-fade-in-up">
                                                    <Icon name="check-circle-2" className="w-8 h-8 text-slate-300" />
                                                    <div className="text-sm text-slate-500 font-medium">没有即将到来的阶段</div>
                                                </div>
                                            ) : (
                                                upcoming.map((task, index) => (
                                                    <div key={task.id} 
                                                        className="animate-fade-in-up p-4 hover:bg-blue-50/50 transition-colors duration-300 flex items-start gap-3 group"
                                                        style={{ animationDelay: `${index * 50}ms` }}
                                                    >
                                                        <div className="mt-0.5 bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-600/20 px-2 sm:px-2.5 py-1 rounded-full text-[10px] sm:text-xs font-bold min-w-[50px] sm:min-w-[60px] text-center shrink-0 shadow-sm">
                                                            {task.daysUntilStart}天后
                                                        </div>
                                                        <div className="flex-1 min-w-0">
                                                            <h4 className="font-semibold text-slate-700 text-xs sm:text-sm leading-snug group-hover:text-blue-700 transition-colors">{task.title}</h4>
                                                            <div className="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1.5 text-[10px] sm:text-xs text-slate-500 font-medium">
                                                                <span className="flex items-center gap-1"><Icon name="calendar" className="w-3 h-3 text-slate-400 group-hover:text-blue-400 transition-colors" /> {task.start}</span>
                                                                <span className="flex items-center gap-1 text-slate-500 bg-slate-100/80 px-2 py-0.5 rounded-full ring-1 ring-inset ring-slate-200/50 group-hover:bg-white group-hover:ring-blue-100 transition-colors">
                                                                    <Icon name="user" className="w-3 h-3 text-slate-400" />
                                                                    {task.action}
                                                                </span>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center sm:opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                                                            <button onClick={() => handleComplete(task.id)} title="提前标记完成" className="p-1.5 text-emerald-600 hover:bg-emerald-100 active:scale-90 rounded-full transition-all">
                                                                <Icon name="check" className="w-4 h-4" />
                                                            </button>
                                                            <button onClick={() => handleHide(task.id)} title="标记为无关" className="p-1.5 text-slate-400 hover:text-rose-500 hover:bg-rose-100 active:scale-90 rounded-full transition-all">
                                                                <Icon name="eye-off" className="w-4 h-4" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </section>

                                {/* 已完成 */}
                                <section>
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-base sm:text-lg font-bold flex items-center gap-2 text-slate-800 tracking-tight">
                                            <Icon name="check-circle-2" className="w-4 h-4 sm:w-5 sm:h-5 text-emerald-500" />
                                            已完成的阶段
                                            <span className="bg-emerald-100 text-emerald-700 text-[10px] sm:text-xs px-2 py-0.5 rounded-full ml-1 font-bold shadow-sm">{completed.length}</span>
                                        </h2>
                                    </div>
                                    <div className="bg-white rounded-2xl ring-1 ring-slate-200/60 shadow-sm overflow-hidden">
                                        <div className="divide-y divide-slate-100 max-h-[350px] sm:max-h-[400px] overflow-y-auto">
                                            {completed.length === 0 ? (
                                                <div className="p-8 flex flex-col items-center justify-center text-center gap-2 animate-fade-in-up">
                                                    <Icon name="inbox" className="w-8 h-8 text-slate-300" />
                                                    <div className="text-sm text-slate-500 font-medium">尚无已完成的阶段</div>
                                                </div>
                                            ) : (
                                                completed.map((task, index) => (
                                                    <div key={task.id} 
                                                        className="animate-fade-in-up p-4 bg-slate-50/40 hover:bg-emerald-50/30 transition-colors duration-300 flex items-start gap-3 group"
                                                        style={{ animationDelay: `${index * 50}ms` }}
                                                    >
                                                        <div className={`mt-0.5 ${task.isManual ? 'text-blue-500 bg-blue-100 shadow-blue-200' : 'text-emerald-500 bg-emerald-100 shadow-emerald-200'} p-1.5 rounded-full shrink-0 shadow-sm`}>
                                                            <Icon name="check-circle-2" className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
                                                        </div>
                                                        <div className="flex-1 min-w-0 opacity-70 group-hover:opacity-100 transition-opacity">
                                                            <h4 className="font-medium text-slate-600 text-xs sm:text-sm line-through decoration-slate-300 leading-snug">{task.title}</h4>
                                                            <p className="text-[10px] sm:text-xs text-slate-400 mt-1 font-medium flex flex-wrap items-center gap-1.5">
                                                                <span className="flex items-center gap-1"><Icon name="calendar" className="w-3 h-3 opacity-50" /> {task.start} - {task.end}</span>
                                                                {task.isManual && <span className="text-blue-600 bg-blue-100/50 ring-1 ring-inset ring-blue-600/20 px-2 py-0.5 rounded-full italic shadow-sm">(手动)</span>}
                                                            </p>
                                                        </div>
                                                        {task.isManual && (
                                                            <button onClick={() => handleUncomplete(task.id)} title="撤销完成状态" className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-100 active:scale-90 rounded-full sm:opacity-0 group-hover:opacity-100 transition-all shrink-0">
                                                                <Icon name="rotate-ccw" className="w-4 h-4" />
                                                            </button>
                                                        )}
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </section>
                            </div>

                            {/* 隐藏项目区域 */}
                            {hidden.length > 0 && (
                                <section className="pt-6 border-t border-slate-200/80">
                                    <button 
                                        onClick={() => setShowHidden(!showHidden)}
                                        className="inline-flex items-center gap-2 text-slate-500 hover:text-blue-600 hover:bg-blue-50 hover:ring-blue-200 transition-all duration-300 font-bold text-xs sm:text-sm bg-white ring-1 ring-slate-200 shadow-sm px-5 py-2.5 rounded-full active:scale-95"
                                    >
                                        <Icon name={showHidden ? "eye" : "eye-off"} className="w-4 h-4" />
                                        已隐藏 / 无关项目 ({hidden.length})
                                    </button>
                                    
                                    {showHidden && (
                                        <div className="animate-fade-in-up mt-4 bg-white rounded-2xl ring-1 ring-slate-200/60 overflow-hidden shadow-sm">
                                            <div className="divide-y divide-slate-100 max-h-[250px] sm:max-h-[300px] overflow-y-auto">
                                                {hidden.map(task => (
                                                    <div key={task.id} className="p-3 sm:p-4 flex items-center justify-between gap-3 group hover:bg-slate-50 transition-colors">
                                                        <div className="flex-1 min-w-0 opacity-50 group-hover:opacity-80 transition-opacity">
                                                            <h4 className="font-medium text-slate-500 text-[11px] sm:text-sm line-through truncate">{task.title}</h4>
                                                            <p className="text-[10px] sm:text-xs text-slate-400 mt-1 font-medium flex flex-wrap items-center gap-2">
                                                                <span className="flex items-center gap-1"><Icon name="calendar" className="w-3 h-3" /> {task.start} - {task.end}</span>
                                                                <span className="text-slate-300 hidden sm:inline">|</span>
                                                                <span className="flex items-center gap-1"><Icon name="user" className="w-3 h-3" /> {task.action}</span>
                                                            </p>
                                                        </div>
                                                        <button 
                                                            onClick={() => handleRestore(task.id)} 
                                                            className="flex items-center gap-1.5 px-3.5 py-1.5 text-[10px] sm:text-xs font-bold text-slate-500 bg-white ring-1 ring-inset ring-slate-300 rounded-full hover:bg-blue-50 hover:text-blue-600 hover:ring-blue-300 active:scale-95 transition-all shrink-0 shadow-sm"
                                                        >
                                                            <Icon name="rotate-ccw" className="w-3.5 h-3.5" /> 恢复
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </section>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
